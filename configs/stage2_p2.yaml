# ────────────────────────────────────────────────────────────────────────────
# Stage 2: YOLOv8s + P2 Detection Layer
# ────────────────────────────────────────────────────────────────────────────

model: "models/yolov8s_p2.yaml"   # Custom P2 model
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 1280
rect: false

# Training (P2 adds ~65% more FLOPs, reduce batch to fit VRAM)
epochs: 100
batch: 12                        # Down from 16 (baseline) for P2 overhead
workers: 8
device: mps
amp: false

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# Logging
project: "experiments/stage2_p2"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
