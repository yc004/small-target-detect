# ────────────────────────────────────────────────────────────────────────────
# Stage 2: YOLO26s-P2 (Official High-Resolution Detection Layer)
# ────────────────────────────────────────────────────────────────────────────
# 使用官方 yolo26s-p2.yaml，增加 P2/4 检测层，提升小目标特征分辨率。
# Batch 减半以容纳 P2 层约 25% 的 FLOPs 增长。
# ────────────────────────────────────────────────────────────────────────────

model: "yolo26s-p2.yaml"           # Official YOLO26 small with P2 detection head
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training (P2 adds ~25% FLOPs → reduce batch to fit VRAM)
epochs: 100
batch: 8                          # Down from 16 for P2 overhead
workers: 8
device: "0"
amp: true

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# Logging
project: "experiments/stage2_p2"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
