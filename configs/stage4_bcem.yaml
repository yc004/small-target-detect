# ────────────────────────────────────────────────────────────────────────────
# Stage 4: YOLO26s-P2 + ARF-Head + BCEM
# ────────────────────────────────────────────────────────────────────────────
# 在 Stage 3 基础上，在 Backbone → Neck 的跳跃连接处插入 BCEM 模块。
# BCEM 对浅层 Backbone 特征进行通道+空间双向上下文增强，
# 抑制背景噪声（道路标线、文字、建筑边缘），增强前景小目标。
# ────────────────────────────────────────────────────────────────────────────

model: "models/yolo26s_p2_arf_bcem.yaml"  # Custom: P2 + ARF + BCEM
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training
epochs: 100
batch: 8
workers: 8
device: "0"
amp: false

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# Logging
project: "experiments/stage4_bcem"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
