# ────────────────────────────────────────────────────────────────────────────
# Stage 3: YOLO26s-P2 + ARF-Head
# ────────────────────────────────────────────────────────────────────────────
# 在官方 P2 变体基础上，为每个检测层插入自适应感受野 (ARF) 模块。
# ARF 通过多分支空洞卷积 + 可学习 softmax 融合，实现尺度感知的特征提取。
# ────────────────────────────────────────────────────────────────────────────

model: "models/yolo26s_p2_arf.yaml"  # Custom: P2 + ARF-Head
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training (ARF adds minor overhead; keep batch=8 from Stage 2)
epochs: 100
batch: 8
workers: 8
device: "0"
amp: false

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# Logging
project: "experiments/stage3_arf_head"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
