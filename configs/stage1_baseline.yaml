# ────────────────────────────────────────────────────────────────────────────
# Stage 1: YOLO26s Baseline Training Configuration
# ────────────────────────────────────────────────────────────────────────────
# 使用官方 yolo26s.yaml，不做任何修改，建立性能基线。
# ────────────────────────────────────────────────────────────────────────────

# Model
model: "yolo26s.yaml"            # Official YOLO26 small (ultralytics built-in)
pretrained: true                  # Load COCO pretrained weights

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training
epochs: 100
batch: 16
workers: 8
device: "0"                       # CUDA GPU 0
amp: false

# Optimization
optimizer: "auto"                 # SGD for small models
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# Logging
project: "experiments/stage1_baseline"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
