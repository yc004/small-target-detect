# ────────────────────────────────────────────────────────────────────────────
# Stage 5: YOLO26s-P2 + ARF-Head + BCEM + HJ-Loss
# ────────────────────────────────────────────────────────────────────────────
# 在 Stage 4 基础上，用分层联合损失 (HJ-Loss) 替换默认 CIoU Loss。
# - P2/P3 层: WIoUv3 + 0.3×NWD (联合监督，尺度鲁棒的定位)
# - P4/P5 层: WIoUv3 (仅动态聚焦，避免 NWD 对大目标的噪声)
# ────────────────────────────────────────────────────────────────────────────

model: "models/yolo26s_p2_arf_bcem.yaml"  # Same model as Stage 4
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training
epochs: 100
batch: 8
workers: 8
device: "0"
amp: false

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing
conf: 0.001
iou: 0.7
max_det: 300

# ── HJ-Loss specific settings ──────────────────────────────────────────
# Note: HJ-Loss is injected via model_builder or a training callback.
# The loss module replaces ultralytics' default CIoU with WIoUv3 + NWD.
# Key parameters (stored here for documentation):
#   nwd_weight: 0.3     # NWD auxiliary loss weight
#   nwd_layers: [P2, P3]  # Layers using NWD (small targets only)
#   nwd_c: 12.0          # NWD normalization constant
#   wiouv3_delta: 2.0    # WIoUv3 dynamic focus strength
# ────────────────────────────────────────────────────────────────────────

# Logging
project: "experiments/stage5_hjloss"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
