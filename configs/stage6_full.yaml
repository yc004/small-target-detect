# ────────────────────────────────────────────────────────────────────────────
# Stage 6: Full Integration — All Improvements Combined
# ────────────────────────────────────────────────────────────────────────────
# Model: YOLO26s-P2 + ARF-Head + BCEM
# Loss:  HJ-Loss (WIoUv3 + NWD for P2/P3)
# Post:  Soft-NMS (Gaussian, σ=0.5)
#
# This is the final model for evaluation, ablation comparison, and demo.
# ────────────────────────────────────────────────────────────────────────────

model: "models/yolo26s_p2_arf_bcem.yaml"
pretrained: true

# Data
data: "data/processed/dataset.yaml"
imgsz: 640
rect: false

# Training
epochs: 100
batch: 8
workers: 8
device: "0"
amp: false

# Optimization
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
patience: 20

# Augmentation
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
close_mosaic: 10

# Post-processing (inference)
conf: 0.25                       # Higher threshold for demo / final eval
iou: 0.5                         # Soft-NMS IoU threshold
max_det: 300

# Logging
project: "experiments/stage6_full"
name: "train"
exist_ok: true
val: true
save: true
save_period: 10
plots: true
