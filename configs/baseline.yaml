# ────────────────────────────────────────────────────────────────────────────
# Stage 1: Baseline YOLOv8s Training Configuration
# ────────────────────────────────────────────────────────────────────────────
# Single source of truth for all training hyperparameters.
# Used by scripts/train.py to ensure reproducible experiments.
# ────────────────────────────────────────────────────────────────────────────

# Model
model: "yolov8s.yaml"          # Official YOLOv8s (no modifications)
pretrained: true                # Load COCO pretrained weights

# Data
data: "data/processed/dataset.yaml"   # Generated by data/prepare_dataset.py
imgsz: 1280                     # Training resolution
rect: false                     # Rectangular training (disable for small datasets)

# Training hyperparameters
epochs: 100
batch: 8
workers: 8
device: mps                     # mps (Apple Silicon) / "0" (CUDA) / "cpu"

# Optimization
optimizer: "auto"               # SGD for small models
lr0: 0.01                       # Initial learning rate
lrf: 0.01                       # Final LR factor (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# LR scheduling
cos_lr: true                    # Cosine annealing
patience: 20                    # Early stopping patience (epochs)

# Augmentation (built-in ultralytics)
mosaic: 1.0                     # Mosaic probability
mixup: 0.0                      # Mixup (off for baseline)
copy_paste: 0.0                 # Copy-paste (off for baseline — will add in Stage 4)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0                    # Rotation
translate: 0.1
scale: 0.5                      # Scaling
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5

# Post-processing
conf: 0.001                     # Confidence threshold during training
iou: 0.7                        # IoU threshold for NMS during training
max_det: 300                    # Max detections per image

# Mosaic — close near end of training for better convergence
close_mosaic: 10                # Disable mosaic for last 10 epochs

# Logging
project: "experiments/stage1_baseline"
name: "train"
exist_ok: true                  # Overwrite existing experiment

# Validation
val: true                       # Run validation during training
save: true                      # Save checkpoints
save_period: 10                 # Save every 10 epochs
plots: true                     # Generate training plots
