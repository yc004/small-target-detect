# ────────────────────────────────────────────────────────────────────────────
# Stage 3: YOLO26s-P2 + ARF-Head
# ────────────────────────────────────────────────────────────────────────────
# Based on ultralytics yolo26-p2.yaml (official P2 variant).
# Adds Adaptive Receptive Field (ARF) modules before each detection layer.
#
# NOTE: Single-input layers MUST use integer 'from' (not list).
#       Only Concat/Detect use list 'from' for multiple inputs.
# ────────────────────────────────────────────────────────────────────────────

nc: 80  # overridden at build time
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ── Backbone (identical to yolo26-p2.yaml) ──────────────────────────────

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# ── Head (yolo26-p2.yaml + ARF modules) ────────────────────────────────

head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12: cat(upsampled, P4 backbone)
  - [-1, 2, C3k2, [512, True]]                      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15: cat(upsampled, P3 backbone)
  - [-1, 2, C3k2, [256, True]]                      # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 17
  - [[-1, 2], 1, Concat, [1]]                       # 18: cat(upsampled, P2 backbone)
  - [-1, 2, C3k2, [128, True]]                      # 19 (P2/4-xsmall)

  # PAN bottom-up
  - [-1, 1, Conv, [128, 3, 2]]                      # 20
  - [[-1, 16], 1, Concat, [1]]                      # 21: cat(downsampled, P3 features)
  - [-1, 2, C3k2, [256, True]]                      # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                      # 23
  - [[-1, 13], 1, Concat, [1]]                      # 24: cat(downsampled, P4 features)
  - [-1, 2, C3k2, [512, True]]                      # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                      # 26
  - [[-1, 10], 1, Concat, [1]]                      # 27: cat(downsampled, P5 backbone)
  - [-1, 1, C3k2, [1024, True, 0.5, True]]          # 28 (P5/32-large)

  # ARF modules — channel values are for scale='s' (width=0.50, max_channels=1024)
  # P2: 128*0.5=64, P3: 256*0.5=128, P4: 512*0.5=256, P5: 1024*0.5=512
  - [19, 1, ARF, [64, [1, 3, 5]]]                   # 29: ARF-P2 (xsmall)
  - [22, 1, ARF, [128, [1, 2, 3]]]                  # 30: ARF-P3 (small)
  - [25, 1, ARF, [256, [1, 1, 2]]]                  # 31: ARF-P4 (medium)
  - [28, 1, ARF, [512, [1, 1, 1]]]                  # 32: ARF-P5 (large)

  # Detection
  - [[29, 30, 31, 32], 1, Detect, [nc]]             # 33: Detect(P2, P3, P4, P5)
