[project]
name = "small-target-detect"
version = "0.1.0"
description = "Improved YOLOv8 for small traffic sign detection on TT100K"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "pycocotools>=2.0.6",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pillow>=10.0.0",
]

[project.scripts]
train = "scripts.train:main"
detect = "scripts.detect:main"
eval = "scripts.eval:main"
demo = "scripts.demo:main"

# ─── Platform-specific PyTorch ─────────────────────────────────────────────
# Linux/Windows: CUDA 12.6 from PyTorch wheel index
# macOS: CPU/MPS from PyPI (default)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
